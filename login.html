<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends&Mel | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background-image: url("Amizade Pet.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #333;
    padding-top: 80px;
}

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b00;
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav ul li {
            position: relative;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            padding: 10px;
            display: block;
        }

        nav ul li a:hover {
            color: #ff6b00;
        }

        .submenu {
            display: none;
            position: absolute;
            top: 42px;
            left: 0;
            background: white;
            min-width: 150px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .submenu li a {
            padding: 12px 15px;
            white-space: nowrap;
        }

        .menu-item:hover .submenu {
            display: block;
        }

        main {
            min-height: calc(100vh - 160px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .login-container h1 {
            text-align: center;
            color: #ff6b00;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-container p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .campo input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .campo input:focus {
            border-color: #ff6b00;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e85d00;
            transform: translateY(-2px);
        }

        .auth-message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            min-height: 24px;
        }

        .cadastro-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff6b00;
            text-decoration: none;
            font-weight: bold;
        }

        .cadastro-link:hover {
            text-decoration: underline;
        }

       footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

footer p {
    margin: 6px 0;
    font-size: 15px;
}

footer strong {
    color: #ff7a00;
}
        @media (max-width: 700px) {
            header {
                padding: 0 15px;
            }

            .logo {
                font-size: 22px;
            }

            nav ul {
                gap: 5px;
            }

            nav ul li a {
                font-size: 13px;
                padding: 8px 5px;
            }

            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="site.html" class="logo">Friends&Mel</a>

        <nav>
            <ul>
                <li>
                    <a href="site.html">Início</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

                <li class="menu-item">
                    <a href="#">Sobre ▾</a>

                    <ul class="submenu">
                        <li>
                            <a href="site.html#empresa">Empresa</a>
                        </li>

                        <li>
                            <a href="site.html#clientes">Clientes</a>
                        </li>
                    </ul>
                </li>

                <li class="menu-item">
                    <a href="#">Contato ▾</a>

                    <ul class="submenu">
                        <li>
                            <a href="site.html#contato">Telefones</a>
                        </li>

                        <li>
                            <a href="mailto:tulilian@amorinfinitopet.com">Email</a>
                        </li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-container">

            <h1>Login</h1>

            <p>Entre na sua conta Friends&Mel</p>

            <form id="loginForm">

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar na Friends&Mel
                </button>

                <div
                    id="loginMensagem"
                    class="auth-message"
                    role="alert">
                </div>

            </form>

            <a href="cadastro.html" class="cadastro-link">
                Ainda não possui uma conta? Cadastre-se
            </a>

        </section>
    </main>

    <footer>
    <p>
        <span id="dataAtual"></span>
        • Todos os direitos reservados.
        Friends&Mel
    </p>

    <p>
        Desenvolvedores:
        <strong>Lílian Assis e Túlio Wagner</strong>
    </p>
</footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");
        const loginMensagem = document.getElementById("loginMensagem");
        const dataAtual = document.getElementById("dataAtual");

        dataAtual.textContent = new Date().toLocaleDateString("pt-BR");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const emailDigitado = email.value.trim().toLowerCase();
            const senhaDigitada = senha.value;

            const usuarioSalvo = localStorage.getItem("usuarioFriendsMel");

            if (!usuarioSalvo) {
                loginMensagem.textContent =
                    "Nenhuma conta cadastrada. Faça seu cadastro primeiro.";
                loginMensagem.style.color = "#d32f2f";
                return;
            }

            try {
                const usuario = JSON.parse(usuarioSalvo);

                const emailCadastrado =
                    String(usuario.email || "").trim().toLowerCase();

                const senhaCadastrada =
                    String(usuario.senha || "");

                if (
                    emailDigitado === emailCadastrado &&
                    senhaDigitada === senhaCadastrada
                ) {
                    localStorage.setItem(
                        "usuarioLogadoFriendsMel",
                        "true"
                    );

                    loginMensagem.textContent =
                        "Login realizado com sucesso!";

                    loginMensagem.style.color = "#168a3a";

                    setTimeout(function() {
                        window.location.href = "site.html";
                    }, 1000);

                } else {
                    loginMensagem.textContent =
                        "E-mail ou senha incorretos. Tente novamente.";

                    loginMensagem.style.color = "#d32f2f";

                    senha.value = "";
                }

            } catch (erro) {
                loginMensagem.textContent =
                    "Erro ao acessar os dados do cadastro.";

                loginMensagem.style.color = "#d32f2f";
            }
        });
    </script>

</body>

</html>
